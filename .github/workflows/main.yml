name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'  # 3일마다 실행 (7일 정지 방지)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Response code: $response"
          if [ "$response" = "000" ] || [ "$response" -ge 500 ]; then
            echo "Ping failed with status $response"
            exit 1
          fi
          echo "Supabase is alive (status: $response)"
