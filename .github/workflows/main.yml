name: Supabase Keep Alive

on:

  schedule:

    - cron: '0 0 */5 * *'

  workflow_dispatch:

jobs:

  ping:

    runs-on: ubuntu-latest

    steps:

      - name: Ping Supabase

        run: |

          response=$(curl -s -o /dev/null -w "%{http_code}" \

            "${{ secrets.SUPABASE_URL }}/auth/v1/health")

          echo "Response code: $response"

          if [ "$response" -ne 200 ]; then

            echo "Ping failed"

            exit 1

          fi

          echo "Supabase is alive." 