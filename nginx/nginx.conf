# 온결 단일 오리진 리버스 프록시
#   /api/* → api:4000 (/api 접두사 제거)   — 브라우저/SSR 모두 같은 오리진으로 API 호출
#   그 외  → web:3000 (Next.js)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;

	# Cloudflare Tunnel 이 넘겨준 원래 프로토콜을 보존한다.
	map $http_x_forwarded_proto $forwarded_proto {
		default $http_x_forwarded_proto;
		""      $scheme;
	}

	upstream ongyeol_web {
		server web:3000;
	}

	upstream ongyeol_api {
		server api:4000;
	}

	server {
		listen 80;
		server_name _;
		client_max_body_size 20m; # 상품 이미지 업로드

		location /api/ {
			proxy_pass http://ongyeol_api/; # 접두사 제거
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
		}

		location / {
			proxy_pass http://ongyeol_web;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
		}
	}
}